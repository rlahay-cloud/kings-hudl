<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kings HUDL game review</title>
<style>
:root{--bg:#0f141b;--card:#171e28;--card2:#1e2733;--ink:#e8edf2;--mute:#8d9bab;--line:#2a3541;--acc:#4da3ff;--k:#3b82f6;--o:#f0714f;--ok:#4ade80;--bad:#ff8a80;--warn:#f5c04a}
@media (prefers-color-scheme:light){:root{--bg:#f3f5f8;--card:#fff;--card2:#eef2f7;--ink:#14202e;--mute:#5d6b7a;--line:#d5dce5;--acc:#0b5cab;--ok:#1a7f4b;--bad:#b3261e}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:16px;margin:0;flex:1 1 300px}header .mute{font-weight:400;font-size:13px}
button,select,input{font:inherit;color:var(--ink)}
button{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}button.pri{background:var(--acc);border-color:var(--acc);color:#fff}button.on{border-color:var(--acc);background:rgba(77,163,255,.18)}
button.link{background:none;border:0;color:var(--acc);padding:4px}
select,input[type=text],input[type=number]{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;padding:14px}
@media (max-width:980px){.wrap{grid-template-columns:1fr}}
.mute{color:var(--mute)}.small{font-size:13px}
#vbox{position:relative;background:#000;border-radius:10px;overflow:hidden}#vid{width:100%;display:block;max-height:60vh;background:#000}
#vpick{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:20px;background:rgba(15,20,27,.92)}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0}.ctl .sp{flex:1}
#tlw{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px}canvas{display:block;width:100%}
#tl{height:120px;cursor:pointer}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.tabs{display:flex;gap:2px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:0 2px 6px;margin-bottom:12px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:6px 2px;color:var(--mute)}
.tabs button.act{color:var(--ink);border-bottom-color:var(--acc)}.tabs .n{font-size:11px;background:var(--card2);border-radius:99px;padding:1px 6px;margin-left:3px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.item{border-top:1px solid var(--line);padding:10px 0}.item:first-child{border-top:0}.item.done{opacity:.55}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{padding:4px 9px;border-radius:99px;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-weight:600;min-width:38px;text-align:center}
.chip.sel{background:var(--acc);border-color:var(--acc);color:#fff}.chip.off{background:var(--o);border-color:var(--o);color:#fff}
.th img{height:64px;border-radius:5px;margin:2px;cursor:zoom-in}
table{border-collapse:collapse;width:100%}td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mute);font-weight:600;font-size:13px}tr.cl{cursor:pointer}tr.cl:hover td{background:var(--card2)}
textarea{width:100%;min-height:120px;font:13px ui-monospace,monospace;background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px}
#rink{border:1px solid var(--line);border-radius:8px;background:#fff}
.tk{display:flex;gap:6px;flex-wrap:wrap}.tkc{border:2px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;background:var(--card2)}.tkc.mine{border-color:var(--ok)}.tkc.other{opacity:.35}.tkc.auto{border-style:dashed;border-color:var(--ok)}
.tkc img{height:70px;border-radius:4px;margin-right:2px}.tkc div{font-size:12px;color:var(--mute)}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50}#zoom img{max-width:94vw;max-height:90vh}
.pill{padding:2px 8px;border-radius:99px;border:1px solid var(--line);font-size:12px}
</style></head><body>
<header>
  <h1 id="title">Kings HUDL game review <span class="mute" id="saved"></span></h1>
  <button id="bJson">Export JSON</button><button id="bCsv">Export shifts CSV</button><button id="bSave">Save review file</button>
  <button class="link" id="bLoad">Load review file</button><input type="file" id="fLoad" accept=".json" style="display:none">
</header>
<div class="wrap">
 <div>
  <div id="vbox"><video id="vid" playsinline preload="metadata"></video>
    <div id="vpick"><div><b>Choose the game video</b></div><div class="mute small">The same file you analysed, or a smaller copy of it. It stays on your computer and is never uploaded.</div><input type="file" id="fVid" accept="video/*,.mov,.mp4,.mkv"></div></div>
  <div class="ctl"><button id="cB5">-5s</button><button id="cB1">-1s</button><button id="cPlay" class="pri">Play</button><button id="cF1">+1s</button><button id="cF5">+5s</button>
    <select id="cSpd"><option>0.5</option><option selected>1</option><option>2</option><option>3</option><option>4</option></select>
    <span class="sp"></span><span id="clk" style="text-align:right"></span></div>
  <div id="tlw"><canvas id="tl" height="120"></canvas>
    <div class="legend"><span><i style="background:#566"></i>Stoppage</span><span><i style="background:var(--k)"></i>Kings change</span><span><i style="background:var(--o)"></i>Other change</span><span><i style="background:var(--warn)"></i>Faceoff</span><span><i style="background:#fff"></i>Period start</span><span><i style="background:#9cf"></i>Shot</span><span class="small">Space play/pause, arrows 1 s, Shift+arrows 5 s, S shot, D their shot</span></div></div>
  <div class="panel small mute" style="margin-top:12px" id="foot"></div>
 </div>
 <div>
  <div class="tabs" id="tabs"></div>
  <div id="pane"></div>
 </div>
</div>
<div id="zoom"><img alt=""></div>
<script>
/*IDENTITY*/
</script>
<script>
var DATA=/*DATA*/null, ROSTER=/*ROSTER*/[];
var $=function(i){return document.getElementById(i)};
var KEY="kh-app-"+(DATA.meta.video||"x");
var S={ks:[],seed:{},notk:{},chg:{},atk:{},fo:{},fon:{},shots:[],pens:[],stopsAdd:[],stopsDel:{},extra:[],names:{},off:0,pm:null,src:"tracks",team:"K",mode:"one",range:"all",live:true,path:true,tab:"roster",pend:null};
try{var sv=JSON.parse(localStorage.getItem(KEY)||"null");if(sv)for(var k in sv)S[k]=sv[k]}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));$("saved").textContent="Saved in this browser "+new Date().toLocaleTimeString()}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ms(t){t=Math.max(0,Math.round(t));return Math.floor(t/60)+":"+("0"+t%60).slice(-2)}
function hms(t){t=Math.max(0,Math.round(t));return Math.floor(t/3600)+":"+("0"+Math.floor(t%3600/60)).slice(-2)+":"+("0"+t%60).slice(-2)}
var V=$("vid"),DUR=DATA.meta.duration||600,END=(DATA.meta.end_req||DUR),TL=DATA.tracklets||[],B=DATA.board||{};
Identity.prep(TL);
$("title").firstChild.textContent=(DATA.meta.video||"Game")+" ";
function now(){return V.currentTime||0}
function seek(t){if(V.readyState>0||V.src)V.currentTime=Math.max(0,t);drawTL()}
function kOK(t){return S.ks.indexOf(t.g)>=0&&!S.notk[t.id]}
function oOK(t){return S.ks.indexOf(t.g)<0&&!S.notk[t.id]}
function stops(){var a=(DATA.stops||[]).filter(function(s,i){return !S.stopsDel[i]}).map(function(s){return[s[0],s[1]]});return a.concat(S.stopsAdd).sort(function(x,y){return x[0]-y[0]})}
function inStop(t){return stops().some(function(s){return t>=s[0]&&t<=s[1]})}
var PER=(B.periods||[]);
function perOf(t){var n=1;PER.forEach(function(p,i){if(t>=p.start-2)n=i+1});return n}
function atkOf(p){return S.atk[p]||"R"}
function clockAt(t){var c=B.clock||[],best=null;for(var i=0;i<c.length;i++){if(c[i].t<=t+0.5&&c[i].sec!==null)best=c[i]}return best}
function rosterNums(){var m={};ROSTER.forEach(function(p){m[p.n]=p.name});S.extra.forEach(function(n){if(!(n in m))m[n]=""});Object.keys(S.names).forEach(function(n){m[n]=S.names[n]});return Object.keys(m).map(Number).sort(function(a,b){return a-b}).map(function(n){return{n:String(n),name:m[n]||S.names[n]||""}})}
function nameOf(n){var r=rosterNums().filter(function(x){return x.n===String(n)})[0];return"#"+n+(r&&r.name?" "+r.name.split(" ")[0]:"")}
/* ---- identity ---- */
var RES=null,ST=null;
function solve(){RES=Identity.assign(TL,S.seed,kOK,0.12)}
function trackStats(){ST=Identity.stats(TL,RES?RES.lab:{},stops(),8)}
/* ---- line changes ---- */
var CH=DATA.changes||[];
function chgState(){var on={},before=[];CH.forEach(function(c,i){before[i]=Object.keys(on);var st=S.chg[i]||{};(st.off||[]).forEach(function(n){delete on[n]});(st.on||[]).forEach(function(n){on[n]=1})});return{before:before,final:Object.keys(on)}}
function shiftsFromChanges(){
  var ev=[];CH.forEach(function(c,i){var st=S.chg[i]||{},t=(c.t0+c.t1)/2;(st.off||[]).forEach(function(n){ev.push([t,"off",n])});(st.on||[]).forEach(function(n){ev.push([t,"on",n])})});
  var by={},open={};ev.sort(function(a,b){return a[0]-b[0]});
  ev.forEach(function(e){var n=e[2];by[n]=by[n]||[];if(e[1]==="on"){if(open[n]===undefined)open[n]=e[0]}else{var a=open[n]!==undefined?open[n]:null;if(a!==null){by[n].push({a:a,b:e[0],pts:[]});delete open[n]}}});
  Object.keys(open).forEach(function(n){by[n]=by[n]||[];by[n].push({a:open[n],b:Math.max(open[n],Math.min(END,DUR)),pts:[],live:true})});
  var out={},sp=stops();
  Object.keys(by).forEach(function(n){var toi=0;by[n].forEach(function(s){var run=s.b-s.a;sp.forEach(function(q){var o=Math.min(s.b,q[1])-Math.max(s.a,q[0]);if(o>0)run-=o});s.clock=Math.max(0,run);toi+=s.clock});if(by[n].length)out[n]={shifts:by[n],toi:toi}});
  return out}
function shifts(){return S.src==="changes"?shiftsFromChanges():(ST||{})}
/* ---- timeline ---- */
var ACT=null;
function activity(){ACT=new Float32Array(Math.ceil(DUR)+2);TL.forEach(function(t){for(var i=1;i<t.pts.length;i++){var a=t.pts[i-1],b=t.pts[i],dt=b[0]-a[0];if(dt<=0||dt>4)continue;ACT[Math.floor(b[0])]+=Math.hypot((b[1]-a[1])*200,(b[2]-a[2])*85)/dt}});
  var s=new Float32Array(ACT.length);for(var i=0;i<ACT.length;i++){var q=0,c=0;for(var j=-3;j<=3;j++)if(ACT[i+j]!==undefined){q+=ACT[i+j];c++}s[i]=q/c}ACT=s}
function drawTL(){
  var c=$("tl"),w=c.clientWidth||600;c.width=w*2;c.height=240;var x=c.getContext("2d");x.scale(2,2);var H=120;
  var span=Math.max(10,Math.min(DUR,END)),X=function(t){return t/span*w};
  x.fillStyle="#141b24";x.fillRect(0,0,w,H);
  stops().forEach(function(s){x.fillStyle="rgba(120,140,150,.35)";x.fillRect(X(s[0]),0,Math.max(2,X(s[1])-X(s[0])),H)});
  if(!ACT)activity();var mx=Math.max.apply(null,ACT)||1;x.strokeStyle="#aab6c4";x.lineWidth=1.3;x.beginPath();for(var i=0;i<ACT.length;i++){var px=X(i),py=H-8-(ACT[i]/mx)*(H-30);if(i)x.lineTo(px,py);else x.moveTo(px,py)}x.stroke();
  CH.forEach(function(ch,i){var kings=Object.keys(ch.thumbs).some(function(g){return S.ks.indexOf(+g)>=0}),dn=(S.chg[i]||{}).done;x.fillStyle=kings?"#3b82f6":"#f0714f";x.globalAlpha=dn?0.35:1;x.fillRect(X(ch.t0),kings?10:H-50,2,40);x.globalAlpha=1});
  (DATA.faceoffs||[]).forEach(function(f){x.fillStyle="#f5c04a";x.beginPath();x.moveTo(X(f.t),H-2);x.lineTo(X(f.t)-4,H-10);x.lineTo(X(f.t)+4,H-10);x.fill()});
  S.shots.forEach(function(s){x.fillStyle=s.team==="K"?"#9cf":"#fa9";x.beginPath();x.moveTo(X(s.t),6);x.lineTo(X(s.t)+4,11);x.lineTo(X(s.t),16);x.lineTo(X(s.t)-4,11);x.fill()});
  PER.forEach(function(p,i){x.fillStyle="#fff";x.fillRect(X(p.start),0,2,H);x.font="11px sans-serif";x.fillText("P"+(i+1),X(p.start)+4,12)});
  x.fillStyle="#7cc4ff";x.fillRect(X(Math.min(now(),span)),0,2,H);
  var cl=clockAt(now());$("clk").innerHTML="<b>"+ms(now())+"</b> / "+ms(Math.min(DUR,END))+"<div class='mute small'>Period "+perOf(now())+(cl?" · game clock "+ms(cl.sec):"")+"</div>"}
$("tl").addEventListener("pointerdown",function(e){var r=this.getBoundingClientRect(),span=Math.max(10,Math.min(DUR,END));function go(ev){seek(Math.max(0,Math.min(span,(ev.clientX-r.left)/r.width*span)))}go(e);var mv=function(ev){go(ev)},up=function(){window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up)};window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up)});
/* ---- video controls ---- */
$("fVid").onchange=function(e){var f=e.target.files[0];if(!f)return;V.src=URL.createObjectURL(f);$("vpick").style.display="none";V.playbackRate=+$("cSpd").value};
$("cPlay").onclick=function(){if(V.paused)V.play();else V.pause()};
$("cB5").onclick=function(){seek(now()-5)};$("cB1").onclick=function(){seek(now()-1)};$("cF1").onclick=function(){seek(now()+1)};$("cF5").onclick=function(){seek(now()+5)};
$("cSpd").onchange=function(){V.playbackRate=+$("cSpd").value};
V.addEventListener("play",function(){$("cPlay").textContent="Pause"});V.addEventListener("pause",function(){$("cPlay").textContent="Play"});
setInterval(function(){if(!V.paused)drawTL()},250);V.addEventListener("seeked",drawTL);
document.addEventListener("keydown",function(e){var tg=e.target.tagName;if(tg==="INPUT"||tg==="TEXTAREA"||tg==="SELECT")return;
  if(e.key===" "){e.preventDefault();$("cPlay").click()}else if(e.key==="ArrowLeft"){e.preventDefault();seek(now()-(e.shiftKey?5:1))}else if(e.key==="ArrowRight"){e.preventDefault();seek(now()+(e.shiftKey?5:1))}
  else if(e.key==="."){seek(now()+1/24)}else if(e.key===","){seek(now()-1/24)}else if(e.key==="s"||e.key==="S"){addShot("K")}else if(e.key==="d"||e.key==="D"){addShot("O")}});
function addShot(team){S.shots.push({t:Math.round(now()*10)/10,team:team,n:""});S.shots.sort(function(a,b){return a.t-b.t});save();drawTL();if(S.tab==="shots")render()}
$("zoom").onclick=function(){$("zoom").style.display="none"};
document.addEventListener("click",function(e){var i=e.target.closest&&e.target.closest("img.zi");if(i){$("zoom").querySelector("img").src=i.src;$("zoom").style.display="flex"}});
function thumbs(c,n){var h="";Object.keys(c.thumbs||{}).forEach(function(g){if(S.ks.length&&S.ks.indexOf(+g)<0)return;c.thumbs[g].slice(0,n||3).forEach(function(s){h+='<img class="zi" src="data:image/jpeg;base64,'+s+'">'})});return h||'<span class="mute small">pick your team colours in Roster to filter</span>'}
</script>
<script>
/* ---- tabs ---- */
function left(){return CH.filter(function(c,i){return !(S.chg[i]||{}).done}).length}
var TABS=[["roster","Roster",function(){return rosterNums().length}],["periods","Periods",function(){return PER.length}],["changes","Line changes",function(){return left()+" left"}],["stops","Stoppages",function(){return stops().length}],["faceoffs","Faceoffs",function(){return(DATA.faceoffs||[]).length}],["shots","Shots",function(){return S.shots.length}],["pens","Penalties",function(){return S.pens.length+penRuns().length}],["shifts","Shifts",null],["heat","Heatmaps",null],["help","Help",null]];
function render(){
  $("tabs").innerHTML=TABS.map(function(t){var n=t[2]?t[2]():"";return'<button data-t="'+t[0]+'" class="'+(S.tab===t[0]?"act":"")+'">'+t[1]+(n!==""?'<span class="n">'+n+'</span>':"")+"</button>"}).join("");
  document.querySelectorAll("#tabs button").forEach(function(b){b.onclick=function(){S.tab=b.dataset.t;save();render()}});
  solve();trackStats();var f=PANES[S.tab]||PANES.help;$("pane").innerHTML='<div class="panel">'+f()+"</div>";(BIND[S.tab]||function(){})();drawTL();
  var tot=0,ok=0;TL.filter(kOK).forEach(function(t){tot+=t.dur;var l=RES&&RES.lab[t.id];if(l&&l.conf>=0.5)ok+=t.dur});
  $("foot").textContent=(S.ks.length?"Kings colours chosen. ":"Choose your team colours in the Roster tab. ")+(tot?Math.round(100*ok/tot)+"% of Kings ice time is labelled with confidence from the tracks you ticked. ":"")+(RES&&RES.over.length?RES.over.length+" seconds show more than 6 Kings skaters at once, so a tick is wrong somewhere.":"")}
var PANES={},BIND={};
function chips(list,sel,cls){return list.map(function(n){return'<span class="chip '+(sel.indexOf(String(n))>=0?cls:"")+'" data-n="'+n+'">'+n+"</span>"}).join("")}
/* roster */
PANES.roster=function(){
  var g=DATA.colours.map(function(c,i){var sm=(DATA.samples[i]||[]).slice(0,3).map(function(s){return'<img class="zi" style="height:70px;border-radius:5px;margin:2px" src="'+s+'">'}).join("");
    return'<div class="item" data-g="'+i+'"><label class="row"><input type="checkbox" class="gk" data-g="'+i+'" '+(S.ks.indexOf(i)>=0?"checked":"")+'> <span style="display:inline-block;width:16px;height:16px;border-radius:50%;background:rgb('+c.join(",")+');border:1px solid var(--line)"></span> <b>Colour group '+(i+1)+'</b> <span class="mute small">'+TL.filter(function(t){return t.g===i}).length+' tracks</span></label><div>'+sm+"</div></div>"}).join("");
  var r=rosterNums().map(function(p){return'<tr><td><b>#'+p.n+'</b></td><td><input type="text" class="rn" data-n="'+p.n+'" value="'+esc(p.name)+'" placeholder="name" style="width:100%"></td></tr>'}).join("");
  return'<b>Which colours are the Kings?</b><p class="mute small">Tick every group that is your team. Referees and the other team stay unticked.</p>'+g+'<h3>Players</h3><table>'+r+'</table><div class="row" style="margin-top:8px"><input type="number" id="addn" placeholder="add #" style="width:90px"><button id="addb">Add</button></div><h3>Time offset</h3><p class="mute small">If your video starts at a different moment than the main stream, type the seconds of difference. It is added to exported times.</p><input type="number" id="offs" step="0.1" value="'+(S.off||0)+'" style="width:120px">'};
BIND.roster=function(){document.querySelectorAll(".gk").forEach(function(c){c.onchange=function(){var g=+c.dataset.g,i=S.ks.indexOf(g);if(c.checked&&i<0)S.ks.push(g);if(!c.checked&&i>=0)S.ks.splice(i,1);save();render()}});
  document.querySelectorAll(".rn").forEach(function(i){i.onchange=function(){S.names[i.dataset.n]=i.value;save()}});
  $("addb").onclick=function(){var n=$("addn").value.replace(/\D/g,"");if(n&&S.extra.indexOf(n)<0){S.extra.push(n);save();render()}};
  $("offs").onchange=function(){S.off=parseFloat($("offs").value)||0;save()}};
/* periods */
PANES.periods=function(){return PER.length?'<p class="mute small">Which way do the Kings attack in each period, as seen in the picture? This decides which end is the offensive zone for faceoffs and heat maps.</p>'+PER.map(function(p,i){return'<div class="item row"><b>Period '+(i+1)+'</b><span class="mute">starts '+ms(p.start)+(p.open?"":", ends "+ms(p.end))+'</span><button class="link" data-go="'+p.start+'">Go</button><span class="sp" style="flex:1"></span><select class="atk" data-p="'+(i+1)+'"><option value="R"'+(atkOf(i+1)==="R"?" selected":"")+'>Kings attack right</option><option value="L"'+(atkOf(i+1)==="L"?" selected":"")+'>Kings attack left</option></select></div>'}).join(""):'<p class="mute">No period start found on the scoreboard in this part of the game.</p>'};
BIND.periods=function(){document.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){seek(+b.dataset.go)}});document.querySelectorAll(".atk").forEach(function(s){s.onchange=function(){S.atk[s.dataset.p]=s.value;save();render()}})};
/* line changes */
PANES.changes=function(){
  if(!CH.length)return'<p class="mute">No bench activity was found.</p>';
  var st=chgState(),nums=rosterNums().map(function(p){return p.n}),first=-1;CH.forEach(function(c,i){if(first<0&&!(S.chg[i]||{}).done)first=i});
  return'<div class="row"><b>'+left()+' left</b><button id="nxt" class="pri">Next to check</button><span class="mute small">Tap who came off, then who came on. Names carry forward.</span></div>'+

  $("hTeam").onchange=function(){S.team=$("hTeam").value;save();render()};$("hMode").onchange=function(){S.mode=$("hMode").value;save();render()};
  $("hLive").onchange=function(){S.live=$("hLive").checked;save();render()};$("hPath").onchange=function(){S.path=$("hPath").checked;save();paint()};
  $("hPl")&&($("hPl").onchange=function(){S.pm=$("hPl").value;S.range="all";save();render()});$("hRange")&&($("hRange").onchange=function(){S.range=$("hRange").value;save();paint()});
  $("hDl").onclick=function(){var a=document.createElement("a");a.href=$("rink").toDataURL("image/png");a.download="heatmap.png";a.click()};
  document.querySelectorAll(".tkc").forEach(function(c){c.onclick=function(){var id=c.dataset.id,sd=S.seed[id];if(sd&&sd.n===String(S.pm)&&sd.w>=1)delete S.seed[id];else S.seed[id]={n:String(S.pm),w:1};save();render()}})};
/* help */
PANES.help=function(){return'<b>How to use this</b><ol class="small"><li><b>Choose the game video</b> (the file you analysed). It stays on your computer.</li><li>In <b>Roster</b>, tick your team colours and add names.</li><li><b>Periods</b>: say which way the Kings attack.</li><li><b>Line changes</b>: work down the queue. Tap who came off and who came on. Press Next to check to jump there.</li><li><b>Faceoffs</b>: tap Win or Loss.</li><li><b>Heatmaps</b>: pick a player, tick the tracks that show them. The more you tick, the more it labels for you.</li><li><b>Shifts</b>: copy the lines into Kings HUDL.</li></ol><p class="small mute">Everything saves in this browser as you go. Use Save review file to keep a copy or move to another computer.</p><p class="small mute">Not automatic yet: shots (press S), penalties, and anything about who has the puck.</p>'};
/* save / export */
function dl(name,text,type){var b=new Blob([text],{type:type||"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click()}
$("bSave").onclick=function(){dl("review_"+(DATA.meta.video||"game").replace(/\.[^.]+$/,"")+".json",JSON.stringify(S))};
$("bLoad").onclick=function(){$("fLoad").click()};
$("fLoad").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);for(var k in o)S[k]=o[k];save();render()}catch(x){alert("That file could not be read.")}};r.readAsText(f)};
$("bJson").onclick=function(){solve();trackStats();var sh=shifts(),out={game:DATA.meta.video,players:{},faceoffs:(DATA.faceoffs||[]).map(function(f,i){return{t:f.t,zone:f.zone?zoneOf(f):null,result:S.fo[i]||null,number:S.fon[i]||null}}),shots:S.shots,penalties:S.pens,stoppages:stops(),state:S};
  Object.keys(sh).forEach(function(n){out.players[n]={name:nameOf(n),toi:Math.round(sh[n].toi),shifts:sh[n].shifts.map(function(s){return{a:Math.round(s.a),b:Math.round(s.b),clock:Math.round(s.clock)}})}});dl("kings_review_export.json",JSON.stringify(out))};
$("bCsv").onclick=function(){var sh=shifts(),rows=["player,shift,start_video_s,end_video_s,game_clock_s"];Object.keys(sh).forEach(function(n){sh[n].shifts.forEach(function(s,i){rows.push([nameOf(n).replace(/,/g," "),i+1,Math.round(s.a),Math.round(s.b),Math.round(s.clock)].join(","))})});dl("shifts.csv",rows.join("\n"),"text/csv")};
window.addEventListener("resize",drawTL);
render();
</script></body></html>
