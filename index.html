<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kings HUDL</title>
<meta name="description" content="Kings HUDL: season stats, game box scores, goals and video for the team">
<meta name="theme-color" content="#0b1220">
<style>
:root {
  --bg: #0b1220; --panel: #131c2e; --panel2: #1a2640; --line: #26334f;
  --fg: #eef2fa; --muted: #93a1bd; --accent: #ff7a1a; --accent-ink: #1a0e00;
  --good: #3ddc97; --bad: #ff6b6b; --blue: #5aa9ff;
  --font: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Barlow Condensed", "Barlow", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.4; }
a { color: var(--blue); }
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 80px; }
header.top { position: sticky; top: 0; z-index: 5; background: rgba(11,18,32,.96); border-bottom: 1px solid var(--line); padding: env(safe-area-inset-top) 0 0; }
.top .in { max-width: 1040px; margin: 0 auto; padding: 10px 16px 0; }
.title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.title h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: .05em; text-transform: uppercase; }
.title .rec { font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: .08em; color: var(--accent); }
nav { display: flex; gap: 4px; overflow-x: auto; margin-top: 6px; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav a { flex: none; padding: 10px 14px; text-decoration: none; color: var(--muted); font-family: var(--display); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-size: 17px; border-bottom: 3px solid transparent; min-height: 44px; }
nav a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }
h2 { font-family: var(--display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 22px; margin: 28px 0 10px; }
h2 small { font-weight: 600; color: var(--muted); font-size: 15px; margin-left: 8px; letter-spacing: .06em; }
h3 { font-family: var(--display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 16px; margin: 0 0 8px; color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.row { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 16px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.kpi b { display: block; font-family: var(--display); font-size: 36px; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-family: var(--display); font-weight: 600; }
.pos { color: var(--good); } .neg { color: var(--bad); } .mut { color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-family: var(--display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; color: var(--muted); }
th.sort { cursor: pointer; } th.sort:hover { color: var(--fg); }
th.on { color: var(--accent); }
tbody tr.click { cursor: pointer; } tbody tr.click:hover { background: var(--panel2); }
.scroll { overflow-x: auto; }
.pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; }
.pcard { display: block; text-decoration: none; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.pcard:hover { border-color: var(--accent); }
.pcard .n { font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1; color: var(--accent); }
.pcard .nm { font-weight: 600; margin: 2px 0 8px; overflow-wrap: anywhere; }
.pcard .st { display: flex; gap: 12px; color: var(--muted); font-size: 13px; }
.pcard .st b { display: block; color: var(--fg); font-size: 18px; font-family: var(--display); }
.lead { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
.lead:last-child { border-bottom: 0; }
.lead .v { font-family: var(--display); font-weight: 700; font-size: 22px; }
.lead .bar { height: 6px; border-radius: 3px; background: var(--accent); margin-top: 4px; }
.pill { display: inline-block; min-width: 24px; text-align: center; padding: 1px 8px; border-radius: 6px; font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .05em; }
.pill.W { background: rgba(61,220,151,.18); color: var(--good); }
.pill.L { background: rgba(255,107,107,.18); color: var(--bad); }
.pill.T { background: rgba(147,161,189,.2); color: var(--muted); }
.score { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 8px 0; flex-wrap: wrap; }
.score .t { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 20px; text-align: center; }
.score .s { font-family: var(--display); font-weight: 700; font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.back { display: inline-block; margin: 14px 0 0; color: var(--muted); text-decoration: none; }
.cmp { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin: 8px 0; }
.cmp .l { text-align: right; } .cmp .c { color: var(--muted); font-family: var(--display); letter-spacing: .08em; text-transform: uppercase; font-size: 14px; }
.cmp b { font-family: var(--display); font-size: 22px; }
.bars { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--panel2); margin-top: 4px; grid-column: 1 / -1; }
.bars i { display: block; background: var(--accent); } .bars i + i { background: var(--blue); }
.insight { padding: 8px 0 8px 12px; border-left: 3px solid var(--accent); margin: 8px 0; }
.empty { text-align: center; padding: 36px 16px; }
.empty .btn { margin-top: 10px; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 12px 18px; min-height: 46px; font-family: var(--display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 17px; }
.btn.alt { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); }
.banner { background: rgba(255,122,26,.15); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; margin: 14px 0; }
.ev { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); }
.ev a.t { font-family: var(--display); font-weight: 700; font-size: 18px; min-width: 70px; }
.ev.goal .lb { color: var(--good); font-weight: 600; } .ev.pen .lb { color: var(--bad); }
svg text { fill: var(--muted); font-family: var(--font); font-size: 11px; }
svg .ax { stroke: var(--line); stroke-width: 1; }
.leg { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
.leg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
.note { color: var(--muted); font-size: 14px; }
.av { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: var(--panel2); border: 2px solid var(--line); flex: none; display: inline-flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 22px; }
.av.sm { width: 30px; height: 30px; font-size: 13px; border-width: 1px; }
.av.lg { width: 96px; height: 96px; font-size: 36px; }
.phead { display: flex; align-items: center; gap: 14px; }
.pcard .top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.lead .who { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; }
.seg button, .chip { min-height: 44px; min-width: 44px; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--fg); font-family: var(--display); font-weight: 600; letter-spacing: .06em; font-size: 17px; }
.seg button[aria-pressed="true"], .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.good { background: var(--good); color: #02170d; } .btn.bad { background: var(--blue); color: #021226; }
.btn[disabled] { opacity: .4; cursor: default; }
.fld { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
.fld label { color: var(--muted); font-size: 13px; font-family: var(--display); letter-spacing: .08em; text-transform: uppercase; }
input[type=text], input[type=url], input[type=date], select, textarea { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--fg); padding: 8px 10px; font: inherit; width: 100%; }
.rinkwrap { max-width: 640px; margin: 0 auto; touch-action: manipulation; }
.rinkwrap svg { display: block; width: 100%; height: auto; border-radius: 14px; background: #dfeaf5; }
.rinkwrap svg text { fill: #5b6b86; font-size: 3.2px; }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
video, .ytbox { width: 100%; max-height: 60vh; background: #000; border-radius: 12px; aspect-ratio: 16 / 9; display: block; }
.clip { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
.clip .tm { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--accent); background: none; border: 0; padding: 0; text-align: left; }
.clip .f { grid-column: 1 / -1; display: grid; grid-template-columns: 130px 1fr auto; gap: 6px; }
.clip .f input.pl { grid-column: 1 / 3; }
.clip .pick { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.pickwrap { grid-column: 1 / -1; display: grid; gap: 4px; }
.chip.pk { min-height: 40px; min-width: 44px; padding: 4px 10px; font-size: 16px; }
@media (max-width: 520px) { .clip .f { grid-template-columns: 1fr; } .clip .f input.pl { grid-column: auto; } }
.stickybar { position: sticky; bottom: 0; z-index: 3; justify-content: center; margin: 12px -14px 0; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line); }
.tagbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tagbtns .btn { min-height: 72px; font-size: 24px; }
.tagbtns .btn:first-child { grid-column: 1 / -1; background: var(--good); color: #02170d; }
.steps { margin: 6px 0 0; padding-left: 20px; } .steps li { margin: 4px 0; }
@media (max-width: 520px) { .score .s { font-size: 52px; } th, td { padding: 8px 6px; } }
@media (prefers-reduced-motion: no-preference) { .pcard { transition: border-color .15s; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap">
</head>
<body>
<header class="top"><div class="in">
  <div class="title"><h1 id="team">Kings HUDL</h1><span class="rec" id="rec"></span><span class="note" id="sub" style="flex-basis:100%"></span></div>
  <nav id="nav" aria-label="Sections"></nav>
</div></header>
<main class="wrap" id="app" aria-live="polite"><p class="note" style="margin-top:24px">Loading stats...</p></main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var D = {games: [], roster: {}, goalieNums: {}, home: "", videos: {}, events: {}, clips: {}, shots: {}, cfg: {}, sample: false, error: ""};

  // ---------- helpers ----------
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; }); }
  function pmText(v) { return v > 0 ? "+" + v : String(v); }
  function pmCls(v) { return v > 0 ? "pos" : v < 0 ? "neg" : ""; }
  function fmtDate(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
    if (!m) return d;
    var names = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return names[+m[2] - 1] + " " + (+m[3]);
  }
  function pname(n) { return D.roster[n] || ""; }
  // Player photos live in photos/<number>.jpg (or .png, .webp). Without one, the number shows.
  window.__av = function (img) {
    var exts = ["jpg", "png", "webp"], i = +img.getAttribute("data-i") || 0;
    if (i + 1 < exts.length) { img.setAttribute("data-i", i + 1); img.src = "photos/" + img.getAttribute("data-n") + "." + exts[i + 1]; return; }
    var d = document.createElement("span"); d.className = img.className; d.textContent = "#" + img.getAttribute("data-n");
    d.setAttribute("aria-hidden", "true");
    img.replaceWith(d);
  };
  function avatar(n, size) {
    return '<img class="av ' + (size || "") + '" data-n="' + n + '" data-i="0" src="photos/' + n + '.jpg" alt="" loading="lazy" onerror="__av(this)">';
  }
  function label(n) { return "#" + n + (pname(n) ? " " + pname(n) : ""); }
  function sum(a, f) { return a.reduce(function (t, x) { return t + f(x); }, 0); }
  function svp(sa, ga) { return sa > 0 ? (sa - ga) / sa : null; }
  function svText(v) { return v === null ? "-" : v >= 1 ? "1.000" : v.toFixed(3).replace(/^0/, ""); }
  function pct(a, b) { return b > 0 ? Math.round(a * 100 / b) + "%" : "-"; }

  // ---------- parsing Streamn files ----------
  function parseSummary(text, id, date) {
    var g = {id: id, date: date, home: "", away: "", hs: 0, as: 0, period: "", hShots: 0, aShots: 0, fo: "", players: [], dnp: [], goalies: [], goals: []};
    var sect = "";
    text.split(/\r?\n/).forEach(function (raw) {
      var line = raw.replace(/\s+$/, ""), m;
      if (!line) return;
      if (/^GOALS$/.test(line)) { sect = "go"; return; }
      if (/^PLAYERS THIS GAME/.test(line)) { sect = "p"; return; }
      if (/^GOALIES THIS GAME/.test(line)) { sect = "g"; return; }
      if (/^SEASON TO DATE/.test(line)) { sect = "s"; return; }
      if (sect === "") {
        if ((m = /^(.*) (\d+) - (\d+) (.*)$/.exec(line))) { g.home = m[1]; g.hs = +m[2]; g.as = +m[3]; g.away = m[4]; }
        else if ((m = /^Period:\s*(.*)$/.exec(line))) g.period = m[1];
        else if ((m = /^Shots:\s*(.*) (\d+), (.*) (\d+)$/.exec(line))) { g.hShots = +m[2]; g.aShots = +m[4]; }
        else if ((m = /^Faceoffs won \(.*\):\s*(.*)$/.exec(line))) g.fo = m[1];
      } else if (sect === "go") {
        if ((m = /^Period (\S+) (\d+):(\d{2}) (HOME|AWAY)(?: #(\d+)(?: assists #(\d+)(?: #(\d+))?)?)?$/.exec(line)))
          g.goals.push({per: m[1], sec: (+m[2]) * 60 + (+m[3]), home: m[4] === "HOME", scorer: m[5] ? +m[5] : null, assists: [m[6], m[7]].filter(Boolean).map(Number)});
      } else if (sect === "p") {
        if ((m = /^#(\d+)\s+(\d+)G\s+(\d+)A\s+(\d+)P\s+\+\/-\s+([+-]?\d+)\s+PIM\s+(\d+)(?:\s+SOG\s+(\d+))?/.exec(line)))
          g.players.push({n: +m[1], g: +m[2], a: +m[3], p: +m[4], pm: +m[5], pim: +m[6], sog: m[7] ? +m[7] : 0});
        else if ((m = /^Did not play:\s*(.*)$/.exec(line)))
          (m[1].match(/#(\d+)/g) || []).forEach(function (x) { g.dnp.push(+x.slice(1)); });
      } else if (sect === "g") {
        if ((m = /^#(\d+)\s+SA\s+(\d+)\s+GA\s+(\d+)\s+SV%\s+(\S+)\s+(?:GAA\s+(\S+)\s+)?TOI\s+(\d+):(\d+)/.exec(line))) {
          var gt = (+m[6]) * 60 + (+m[7]);
          if (+m[2] || +m[3] || gt) g.goalies.push({n: +m[1], sa: +m[2], ga: +m[3], toi: gt});
        }
      }
    });
    g.result = g.hs > g.as ? "W" : g.hs < g.as ? "L" : "T";
    return g.home ? g : null;
  }
  // Streamn's season_backup.txt has the roster and goalies with names: number:...=Name
  function parseBackup(text) {
    var out = {players: [], goalies: []};
    text.split(/\r?\n/).forEach(function (line) {
      var m = /^(roster|goalies)=(.*)$/.exec(line.trim()); if (!m) return;
      var body = m[1] === "goalies" ? m[2].split(";")[0] : m[2];
      body.split(",").forEach(function (item) {
        var q = /^(\d+):[^=]*(?:=(.*))?$/.exec(item.trim()); if (!q) return;
        (m[1] === "roster" ? out.players : out.goalies).push({n: +q[1], name: (q[2] || "").trim()});
      });
    });
    return out;
  }
  function parseEvents(text) {
    var out = [];
    text.split(/\r?\n/).forEach(function (line) {
      var m = /^(\d+):(\d{2}):(\d{2})\s+(.*)$/.exec(line.trim());
      if (m) out.push({sec: (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3]), label: m[4]});
    });
    return out;
  }
  function ytLink(url, sec) {
    var m = /(?:youtu\.be\/|v=|\/live\/|\/embed\/)([\w-]{6,})/.exec(url);
    return m ? "https://www.youtube.com/watch?v=" + m[1] + "&t=" + sec + "s" : url;
  }

  // ---------- loading ----------
  function getText(url) {
    return fetch(url, {cache: "no-cache"}).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); });
  }
  function listGameFiles() {
    var host = location.hostname, m = /^([^.]+)\.github\.io$/.exec(host);
    var repo = location.pathname.split("/")[1];
    var viaApi = m && repo ? fetch("https://api.github.com/repos/" + m[1] + "/" + repo + "/contents/games", {headers: {"Accept": "application/vnd.github+json"}})
      .then(function (r) { if (!r.ok) throw new Error("api " + r.status); return r.json(); })
      .then(function (items) { var names = items.map(function (i) { return i.name; }); try { localStorage.setItem("rs-files", JSON.stringify(names)); } catch (e) {} return names; }) : Promise.reject(new Error("not github"));
    return viaApi.catch(function () {
      return getText("games/index.json").then(JSON.parse).catch(function () {
        try { var c = JSON.parse(localStorage.getItem("rs-files") || "null"); if (c) return c; } catch (e) {}
        return [];
      });
    });
  }
  function loadAll() {
    var rosterP = getText("roster.json").then(JSON.parse).then(function (r) {
      D.home = r.home || "";
      (r.roster || []).forEach(function (p) { D.roster[p.n] = p.name || ""; });
      (r.goalies || []).forEach(function (p) { D.roster[p.n] = p.name || ""; });
    }).catch(function () {});
    var backupP = rosterP.then(function () { return getText("season_backup.txt"); }).then(function (t) {
      var b = parseBackup(t);
      if (!b.players.length && !b.goalies.length) return;
      // Streamn's roster is the source of truth. roster.json only fills in missing names.
      var old = D.roster, fresh = {};
      b.players.forEach(function (p) { fresh[p.n] = p.name || old[p.n] || ""; });
      b.goalies.forEach(function (g) { D.goalieNums[g.n] = true; fresh[g.n] = g.name || old[g.n] || ""; });
      D.roster = fresh;
    }).catch(function () {});
    var cfgP = getText("config.json").then(JSON.parse).then(function (c) { D.cfg = c || {}; }).catch(function () { D.cfg = {}; });
    var videosP = getText("videos.txt").then(function (t) {
      t.split(/\r?\n/).forEach(function (l) { var m = /^(\d{4}-\d{2}-\d{2})\s+(\S+)/.exec(l.trim()); if (m) D.videos[m[1]] = m[2]; });
    }).catch(function () {});
    var gamesP = listGameFiles().then(function (names) {
      var sums = names.filter(function (n) { return /^game_summary_\d{4}-\d{2}-\d{2}_\d{6}\.txt$/.test(n); }).sort();
      var evs = names.filter(function (n) { return /^timestamps_\d{4}-\d{2}-\d{2}\.txt$/.test(n); });
      var clipFiles = names.filter(function (n) { return /^clips_\d{4}-\d{2}-\d{2}(_[a-z0-9-]+)?\.txt$/.test(n); });
      var shotFiles = names.filter(function (n) { return /^shots_\d{4}-\d{2}-\d{2}(_[a-z0-9-]+)?\.txt$/.test(n); });
      var jobs = sums.map(function (n) {
        var d = /(\d{4}-\d{2}-\d{2})_(\d{6})/.exec(n);
        return getText("games/" + n).then(function (t) { var g = parseSummary(t, d[1] + "_" + d[2], d[1]); if (g) D.games.push(g); }).catch(function () {});
      });
      evs.forEach(function (n) {
        var d = /(\d{4}-\d{2}-\d{2})/.exec(n)[1];
        jobs.push(getText("games/" + n).then(function (t) { D.events[d] = parseEvents(t); }).catch(function () {}));
      });
      clipFiles.forEach(function (n) {
        var m = /(\d{4}-\d{2}-\d{2})(?:_([a-z0-9-]+))?\.txt$/.exec(n), d = m[1], slug = m[2] || "coach";
        jobs.push(getText("games/" + n).then(function (t) { (D.clips[d] = D.clips[d] || {})[slug] = parseClips(t); }).catch(function () {}));
      });
      shotFiles.forEach(function (n) {

  // ---------- sample data (only when asked) ----------

    var rnd = (function (s) { return function () { s = (s * 16807) % 2147483647; return s / 2147483647; }; })(42);
    var opp = ["Seaway Valley Rapids", "Gloucester Rangers", "Brockville Bulldogs", "Kemptville Panthers", "Cornwall Colts", "Perth Blades"];
    var dates = ["2026-09-26", "2026-10-03", "2026-10-10", "2026-10-17", "2026-10-24", "2026-10-31"];
    D.games = dates.map(function (d, i) {
      var hs = Math.floor(rnd() * 6), as = Math.floor(rnd() * 5);
      var players = [], goalsLeft = hs, sog = 0;
      nums.forEach(function (n) {
        var gl = goalsLeft > 0 && rnd() < .3 ? 1 : 0; goalsLeft -= gl;
        var a = rnd() < .3 ? 1 : 0, s = Math.floor(rnd() * 5) + gl;

    D.games.forEach(function (g) {
      var l = [], n = g.hShots;
      for (var i = 0; i < n; i++) {
        var who = nums[Math.floor(rnd() * nums.length)];
        l.push({p: 1 + Math.floor(rnd() * 3), x: Math.min(.98, .55 + rnd() * .4), y: Math.min(.95, Math.max(.05, .5 + (rnd() - .5) * .7)), n: who, r: i < g.hs ? "G" : "S", t: "H"});

        a.gp++; a.g += p.g; a.a += p.a; a.p += p.p; a.pm += p.pm; a.pim += p.pim; a.sog += p.sog;

  // ---------- svg charts ----------
  function lineChart(series, labels, o) {
    o = o || {};

    var max = Math.max.apply(null, [1].concat.apply([], series.map(function (s) { return s.v; })));
    max = Math.ceil(max / (o.step || 1)) * (o.step || 1) || 1;
    var min = o.min || 0;
    var x = function (i) { return n === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (n - 1); };
    var y = function (v) { return T + (H - T - B) * (1 - (v - min) / (max - min)); };
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="' + esc(o.label || "chart") + '">';
    for (var k = 0; k <= 4; k++) {
      var val = min + (max - min) * k / 4, yy = y(val);
      out += '<line class="ax" x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '"/><text x="' + (L - 5) + '" y="' + (yy + 4) + '" text-anchor="end">' + (o.fmt ? o.fmt(val) : Math.round(val * 10) / 10) + '</text>';
    }
    labels.forEach(function (lb, i) { out += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(lb) + '</text>'; });
    series.forEach(function (s) {
      var pts = s.v.map(function (v, i) { return v === null ? null : [x(i), y(v)]; });
      var d = "", pen = false;
      pts.forEach(function (p) { if (!p) { pen = false; return; } d += (pen ? "L" : "M") + p[0] + " " + p[1]; pen = true; });
      out += '<path d="' + d + '" fill="none" stroke="' + s.c + '" stroke-width="2.5" stroke-linejoin="round"/>';
      pts.forEach(function (p) { if (p) out += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.5" fill="' + s.c + '"/>'; });
    });
    out += "</svg>";
    out += '<div class="leg">' + series.map(function (s) { return '<span><i style="background:' + s.c + '"></i>' + esc(s.name) + "</span>"; }).join("") + "</div>";
    return out;
  }
  function barChart(vals, labels, o) {

    var W = 560, H = 170, L = 30, R = 8, T = 10, B = 26, n = vals.length;
    var max = Math.max.apply(null, [1].concat(vals));
    var bw = (W - L - R) / Math.max(n, 1);
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="' + esc(o.label || "chart") + '">';
    out += '<line class="ax" x1="' + L + '" x2="' + (W - R) + '" y1="' + (H - B) + '" y2="' + (H - B) + '"/>';

    return "<h2>Shot map</h2>" +
      '<div class="card"><div class="filters"><div class="fld"><label for="mpGame">Game</label><select id="mpGame"><option value="">All games</option>' + ds.map(function (d) { return '<option value="' + d + '">' + fmtDate(d) + "</option>"; }).join("") + "</select></div>" +
      '<div class="fld"><label for="mpPl">Player</label><select id="mpPl"><option value="">Everyone</option>' + nums.map(function (n) { return '<option value="' + n + '">' + esc(label(n)) + "</option>"; }).join("") + "</select></div>" +
      '<div class="fld"><label for="mpRes">Result</label><select id="mpRes"><option value="">All shots</option><option value="G">Goals</option><option value="S">Saved</option></select></div>' +
      '<div class="fld"><label for="mpTeam">Team</label><select id="mpTeam"><option value="H">Us</option><option value="A">Opponent</option></select></div>' +
      '<div class="fld"><label for="mpCoach">Marked by</label><select id="mpCoach"><option value="">Everyone</option>' + coachesWithShots().map(function (c) { return "<option>" + esc(c) + "</option>"; }).join("") + "</select></div></div>" +
      '<label class="note"><input type="checkbox" id="mpHeat" checked> Show heat</label>' +
      '<div class="kpis" id="mpKpi"></div>' + rinkSvg() +
      '<div class="leg"><span><i style="background:#ff7a1a;border-radius:50%"></i>Goal</span><span><i style="border:2px solid #1e5fd0;border-radius:50%"></i>Saved</span></div>' +
      (ds.length ? "" : '<p class="note">No shots marked yet. Coaches can add shots in Coaches corner.</p>') + "</div>";
  }
  var PERIODS_LABEL = ["1", "2", "3", "OT"];
  function coachesWithShots() {
    var set = {}; shotDates().forEach(function (d) { allShots(d).forEach(function (s) { set[s.coach] = 1; }); });
    return Object.keys(set).sort();
  }
  function bindShots(sub) {
    if (sub === "mark") return bindMark();
    function all() { var out = []; shotDates().forEach(function (d) { allShots(d).forEach(function (s) { out.push({d: d, p: s.p, x: s.x, y: s.y, n: s.n, r: s.r, t: s.t, c: s.coach}); }); }); return out; }
    var data = all();
    function draw() {
      var g = $("mpGame").value, pl = $("mpPl").value, r = $("mpRes").value, t = $("mpTeam").value, co = $("mpCoach").value;
      var f = data.filter(function (s) { return (!g || s.d === g) && (!pl || s.n === +pl) && (!r || s.r === r) && s.t === t && (!co || s.c === co); });
      var goals = f.filter(function (s) { return s.r === "G"; }).length;
      var out = marksSvg(f, $("mpHeat").checked);
      $("rinkHeat").innerHTML = out.heat; $("rinkMarks").innerHTML = out.marks;
      $("mpKpi").innerHTML = kpi(f.length, "Shots") + kpi(goals, "Goals") + kpi(f.length ? Math.round(goals * 100 / f.length) + "%" : "-", "Shooting %");
    }
    ["mpGame", "mpPl", "mpRes", "mpTeam", "mpCoach", "mpHeat"].forEach(function (id) { $(id).addEventListener("change", draw); });
    draw();
  }
  function bindMark() {
    var st = {p: 1, t: "H", n: null, pend: null}, nums = rosterNums();
    bindCoach();
    function date() { return $("shDate").value; }
    function list() { return getMyShots(date()); }
    function btns(wrapId, onPick) {
      $(wrapId).addEventListener("click", function (e) {
        var b = e.target.closest("button"); if (!b) return;
        Array.prototype.forEach.call($(wrapId).children, function (x) { x.setAttribute("aria-pressed", String(x === b)); });
        onPick(b.getAttribute("data-v"));
      });
    }
    function drawPlayers() {
      $("shPl").innerHTML = '<button data-v="" aria-pressed="' + (st.n === null) + '">?</button>' + nums.map(function (n) { return '<button data-v="' + n + '" aria-pressed="' + (st.n === n) + '">#' + n + "</button>"; }).join("");
      $("shPlWrap").style.display = st.t === "H" ? "" : "none";
    }
    function drawMarks() {
      var l = list().filter(function (s) { return true; }), out = marksSvg(l, false);
      var pend = st.pend ? '<circle cx="' + st.pend.x * 100 + '" cy="' + st.pend.y * 85 + '" r="2.6" fill="none" stroke="#d33" stroke-width=".9" stroke-dasharray="1.2 1"/>' : "";
      $("rinkMarks").innerHTML = out.marks + pend;
      var goals = l.filter(function (s) { return s.r === "G"; }).length;
      $("shNote").textContent = l.length + " shots marked for this game, " + goals + " goals.";
      $("shGoal").disabled = $("shSave").disabled = !st.pend;
    }
    drawPlayers(); drawMarks();
    $("shDate").addEventListener("change", function () { st.pend = null; drawMarks(); });
    btns("shTeam", function (v) { st.t = v; drawPlayers(); });
    btns("shPer", function (v) { st.p = +v; });
    $("shPl").addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return; var v = b.getAttribute("data-v"); st.n = v === "" ? null : +v; drawPlayers();
    });
    $("rink").addEventListener("click", function (e) {
      var svg = $("rink"), pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      var q = pt.matrixTransform(svg.getScreenCTM().inverse());
      st.pend = {x: Math.min(1, Math.max(0, q.x / 100)), y: Math.min(1, Math.max(0, q.y / 85))}; drawMarks();
    });
    function commit(r) {
      if (!st.pend) return;
      var l = list(); l.push({p: st.p, x: st.pend.x, y: st.pend.y, n: st.t === "H" ? st.n : null, r: r, t: st.t});
      putShots(date(), l); st.pend = null; drawMarks();
    }
    $("shGoal").addEventListener("click", function () { commit("G"); });
    $("shSave").addEventListener("click", function () { commit("S"); });
    $("shUndo").addEventListener("click", function () { var l = list(); if (!l.length) return; l.pop(); putShots(date(), l); drawMarks(); });
    $("shSend").addEventListener("click", function () { var l = list(); if (!l.length) { $("shShare").textContent = "Nothing marked yet."; return; } submitFile("shots", date(), fmtShots(l), $("shShare")); });
  }

  // ---------- router ----------
  var tabs = [["", "Overview"], ["players", "Players"], ["games", "Games"], ["clips", "Highlights"], ["shots", "Shot map"], ["video", "Video"], ["coach", "Coaches corner"]];
  function route() {
    var parts = location.hash.replace(/^#\/?/, "").split("/");
    var base = parts[0] || "";
    var cur = base === "player" ? "players" : base === "game" ? "games" : base;
    $("nav").innerHTML = tabs.map(function (t) { return '<a href="#/' + t[0] + '"' + (t[0] === cur ? ' aria-current="page"' : "") + ">" + t[1] + "</a>"; }).join("");
    var t = team();
    $("team").textContent = "Kings HUDL";
    $("sub").textContent = D.home || "";
    $("rec").textContent = D.games.length ? t.w + "-" + t.l + "-" + t.t + (D.sample ? " (sample)" : "") : "";
    document.title = "Kings HUDL";
    var h = D.sample ? '<div class="banner">This is sample data to show how the site looks. It is not real.</div>' : "";
    if (base === "shots" && parts[1] === "mark") { location.replace("#/coach/shots"); return; }
    if (base === "coach") h += parts[1] === "shots" ? vShots("mark") : vClips(parts[1], "mark");
    else if (base === "clips") h += vClips(parts[1], "watch");
    else if (base === "shots") h += vShots();
    else if (!D.games.length) h += vEmpty();
    else if (base === "players") h += vPlayers();
    else if (base === "player") h += vPlayer(+parts[1]);
    else if (base === "games") h += vGames();
    else if (base === "game") h += vGame(parts[1]);
    else if (base === "goalies") { location.replace("#/players"); return; }
    else if (base === "video") h += vVideo();
    else h += vOverview();
    $("app").innerHTML = h;
    if (base === "coach") { if (parts[1] === "shots") bindShots("mark"); else bindClips(parts[1], "mark"); }
    if (base === "clips") bindClips(parts[1], "watch");
    if (base === "video") bindVideo();
    if (base === "shots") bindShots();
    var sb = $("sampleBtn"); if (sb) sb.addEventListener("click", function () { sampleData(); route(); });
    Array.prototype.forEach.call(document.querySelectorAll("th.sort"), function (th) {
      th.addEventListener("click", function () { var k = th.getAttribute("data-k"); if (k === sortKey) sortDir = -sortDir; else { sortKey = k; sortDir = -1; } route(); });
    });
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  if (/[?&]sample\b/.test(location.search)) { loadAll().then(function () { if (!D.games.length) sampleData(); route(); }); }
  else loadAll().then(route, function (e) { D.error = String(e); route(); });
  window.__rs = {D: D, parseSummary: parseSummary, parseEvents: parseEvents};
})();
</script>
</body>
</html>
