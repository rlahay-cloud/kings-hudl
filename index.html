.shfv.fs #shfOverlay .shfbench { min-height: 44px; padding: 4px; gap: 4px; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); border-width: 1px; } .shfv.fs #shfOverlay .shfbench .note { display: none; }

<body>
<header class="top"><div class="in">
  <div class="title"><h1 id="team">Kings HUDL</h1><span class="rec" id="rec"></span><span class="note" id="sub" style="flex-basis:100%"></span></div>
  <nav id="nav" aria-label="Sections"></nav>
</div></header>
<main class="wrap" id="app" aria-live="polite"><p class="note" style="margin-top:24px">Loading stats...</p></main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var D = {games: [], roster: {}, goalieNums: {}, home: "", videos: {}, events: {}, clips: {}, shots: {}, review: {}, cfg: {}, pos: {}, draws: {}, shifts: {}, sync: {}, sample: false, error: ""};

  // ---------- helpers ----------
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; }); }
  function pmText(v) { return v > 0 ? "+" + v : String(v); }
  function pmCls(v) { return v > 0 ? "pos" : v < 0 ? "neg" : ""; }
  function fmtDate(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
    if (!m) return d;
    var names = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return names[+m[2] - 1] + " " + (+m[3]);
  }
