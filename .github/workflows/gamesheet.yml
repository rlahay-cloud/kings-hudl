name: GameSheet update
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gamesheet
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Update from GameSheet
        run: python gamesheet/update_gamesheet.py --cloud
        continue-on-error: true
      - name: Save results
        if: always()
        run: |
          git config user.name "Kings Film Room"
          git config user.email "noreply@github.com"
          git add games/gamesheet games/standings.csv
          git diff --cached --quiet || git commit -m "GameSheet update"
          git pull --rebase
          git push
